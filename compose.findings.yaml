services:
  findings:
    image: ${CODEX_SECURITY_FINDINGS_IMAGE:-ghcr.io/openai/codex-security:latest}
    init: true
    entrypoint: ["node"]
    command: ["dist/server/index.js"]
    working_dir: /usr/local/lib/node_modules/@openai/codex-security
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      CODEX_SECURITY_STATE_DIR: /state
      OPENAI_API_KEY:
      CODEX_API_KEY:
      CODEX_SECURITY_EMBEDDINGS_URL:
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - findings-state:/state

volumes:
  findings-state:
