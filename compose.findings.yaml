services:
  findings:
    build:
      context: .
      target: findings-service
    init: true
    env_file: docker/findings.env
    environment:
      OPENAI_API_KEY:
      CODEX_API_KEY:
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - findings-state:/state

volumes:
  findings-state:
