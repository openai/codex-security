tasks:
  install:
    name: Install dependencies
    command: |
      npm install --global bun@1.3.14 --no-audit --no-fund
      if ! command -v rg >/dev/null 2>&1; then
        sudo apt-get update \
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
          -o Dir::Etc::sourceparts=-
        sudo apt-get install --yes ripgrep
      fi
      bun install --cwd sdk/typescript --frozen-lockfile
      bun install --cwd plugins/codex-security/mcp-app --frozen-lockfile
      python -m pip install --disable-pip-version-check --no-input -e 'plugins/codex-security[test]'
    triggeredBy:
      - manual
      - prebuild

  build:
    name: Build
    command: bun run --cwd sdk/typescript build
    dependsOn:
      - install
    triggeredBy:
      - manual
      - prebuild

  test:
    name: Run tests
    command: |
      bun run --cwd sdk/typescript test
      bun run --cwd sdk/typescript test:mcp
      python -m pytest plugins/codex-security/tests -q
    dependsOn:
      - build
    triggeredBy:
      - manual
