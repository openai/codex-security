tasks:
  install:
    name: Install dependencies
    command: |
      npm install --global pnpm@11.9.0 bun@1.3.14 --no-audit --no-fund
      if ! command -v rg >/dev/null 2>&1; then
        sudo apt-get update \
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
          -o Dir::Etc::sourceparts=-
        sudo apt-get install --yes ripgrep
      fi
      pnpm --dir sdk/typescript install --frozen-lockfile
      pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      python -m pip install --disable-pip-version-check --no-input -e 'plugins/codex-security[test]'
    triggeredBy:
      - manual
      - prebuild

  build:
    name: Build
    command: pnpm --dir sdk/typescript run build
    dependsOn:
      - install
    triggeredBy:
      - manual
      - prebuild

  test:
    name: Run tests
    command: |
      pnpm --dir sdk/typescript run test
      pnpm --dir sdk/typescript run test:mcp
      python -m pytest plugins/codex-security/tests -q
    dependsOn:
      - build
    triggeredBy:
      - manual
