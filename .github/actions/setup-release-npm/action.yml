name: Set up release npm
description: Install and verify the pinned npm for release provenance.
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.15.0"
        registry-url: "https://registry.npmjs.org"
        package-manager-cache: false

    - name: Install provenance-capable npm
      shell: bash
      run: |
        set -euo pipefail
        source .github/scripts/release-npm.sh
        install_release_npm
        printf '%s\n' "$release_npm_bin" >> "$GITHUB_PATH"

    - name: Verify npm on PATH
      shell: bash
      run: |
        set -euo pipefail
        source .github/scripts/release-npm.sh
        verify_release_npm "$(command -v npm)"
