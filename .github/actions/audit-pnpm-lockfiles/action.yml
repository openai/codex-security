name: Audit pnpm lockfiles
description: Check selected dependency trees locally against the vulnerability database.
inputs:
  targets:
    description: Space-separated workspaces to audit (mcp and/or evals).
    required: true
runs:
  using: composite
  steps:
    - name: Install Trivy
      uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
      with:
        tool: trivy@0.76.1
    - name: Check for high and critical vulnerabilities
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        read -ra targets <<< "$TARGETS"
        for target in "${targets[@]}"; do
          case "$target" in
            mcp) scope=(--dir plugins/codex-security/mcp-app sbom --prod) ;;
            evals) scope=(--dir evals/triage-finding sbom) ;;
            *) echo "Unknown audit target: $target" >&2; exit 1 ;;
          esac
          echo "Auditing $target lockfile"
          sbom="$RUNNER_TEMP/$target.cdx.json"
          pnpm "${scope[@]}" --lockfile-only --sbom-format cyclonedx > "$sbom"
          trivy sbom --offline-scan --disable-telemetry --skip-version-check \
            --exit-code 1 --severity HIGH,CRITICAL "$sbom"
        done
