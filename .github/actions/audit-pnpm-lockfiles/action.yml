name: Audit pnpm lockfiles
description: Check selected dependency trees locally against the vulnerability database.
inputs:
  targets:
    description: Space-separated inventories to audit (mcp, evals, tokenizer).
    required: true
runs:
  using: composite
  steps:
    - name: Install Trivy
      uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
      with:
        tool: trivy@0.76.1
    - name: Check for high and critical vulnerabilities
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        read -ra targets <<< "$TARGETS"
        for target in "${targets[@]}"; do
          echo "Auditing $target dependencies"
          sbom="$RUNNER_TEMP/$target.cdx.json"
          case "$target" in
            mcp) pnpm --dir plugins/codex-security/mcp-app sbom --prod --lockfile-only --sbom-format cyclonedx > "$sbom" ;;
            evals) pnpm --dir evals/triage-finding sbom --lockfile-only --sbom-format cyclonedx > "$sbom" ;;
            tokenizer)
              pnpm --dir sdk/typescript exec node scripts/build-embedding-tokenizer.mjs
              sbom="sdk/typescript/dist/server/embedding-tokenizer.cdx.json"
              ;;
            *) echo "Unknown audit target: $target" >&2; exit 1 ;;
          esac
          trivy sbom --offline-scan --disable-telemetry --skip-version-check \
            --exit-code 1 --severity HIGH,CRITICAL "$sbom"
        done
