name: Set up TypeScript tools
description: Install the pinned package manager and Node.js runtime for repository tools.
inputs:
  setup-node:
    description: Install the pinned Node.js runtime; false keeps an earlier setup step.
    default: "true"
  cache-dependency-path:
    description: Lockfiles used for the pnpm store cache.
    default: "sdk/typescript/pnpm-lock.yaml"
  architecture:
    description: Node.js architecture; empty selects the runner architecture.
  compile:
    description: Compile TypeScript tools after setup.
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: package.json
        cache: true
        cache_dependency_path: ${{ inputs.cache-dependency-path }}
    - name: Set up Node.js
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22.13.0"
        architecture: ${{ inputs.architecture }}
    - name: Compile TypeScript tools
      if: inputs.compile == 'true'
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      working-directory: .
      run: |
        pnpm --dir sdk/typescript install --frozen-lockfile
        ${{ runner.os == 'Windows' && 'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }' || '' }}
        pnpm --dir sdk/typescript run build:ci
