name: Documentation issue
description: Report missing, incorrect, or unclear Codex Security documentation.
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation page or file
      description: Link to the page or repository file.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs to change?
      description: Describe the incorrect or missing information without including sensitive data.
    validations:
      required: true
