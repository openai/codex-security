name: Feature request
description: Suggest an improvement to the Codex Security CLI or TypeScript SDK.
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your workflow and the limitation you encountered.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like Codex Security to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other approaches you considered
