name: node-release-pr

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the release PR without changing GitHub
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: node-release-pr
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.repository == 'openai/codex-security' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
      (github.event_name != 'workflow_dispatch' && vars.RELEASE_PR_ENABLED != 'true'))
    name: preview release PR
    runs-on: ubuntu-latest
    env:
      RELEASE_PR_DRY_RUN: "true"

    steps:
      - name: Checkout main, never the release PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"

      - name: Preview the rolling release proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: node sdk/typescript/scripts/release-pr.mjs

  reconcile:
    if: >-
      github.repository == 'openai/codex-security' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && !inputs.dry_run) ||
      (github.event_name != 'workflow_dispatch' && vars.RELEASE_PR_ENABLED == 'true'))
    name: maintain release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_PR_DRY_RUN: "false"

    steps:
      - name: Checkout main, never the release PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"

      - name: Create repository-scoped release App token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Reconcile the rolling release proposal
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: node sdk/typescript/scripts/release-pr.mjs
