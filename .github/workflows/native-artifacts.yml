name: native-artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Source commit to build; defaults to the calling workflow commit.
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    uses: ./.github/workflows/native-unix.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
  windows:
    uses: ./.github/workflows/native-windows.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
  musl:
    uses: ./.github/workflows/native-musl.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
  bundle:
    needs: [unix, windows, musl]
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified platform payloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-platform-*-${{ inputs.ref || github.sha }}
          merge-multiple: true
          path: native
      - name: Upload universal native payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-universal-${{ inputs.ref || github.sha }}
          path: native/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
