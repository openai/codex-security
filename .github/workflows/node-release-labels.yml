name: node-release-labels

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: node-release-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  categorize:
    if: github.repository == 'openai/codex-security'
    name: categorize release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Categorize pull request without checking out its code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          release_note_label() {
            local type="$1" breaking_marker="$2"
            if [[ "$breaking_marker" == "!" ]]; then
              printf '%s\n' breaking-change
              return 0
            fi

            case "$type" in
              feat)
                printf '%s\n' enhancement
                ;;
              fix)
                printf '%s\n' bug
                ;;
              docs)
                printf '%s\n' documentation
                ;;
              release | test)
                printf '%s\n' skip-release-notes
                ;;
              *)
                return 0
                ;;
            esac
          }

          title_sentinel="__CODEX_SECURITY_TITLE_END__"
          current_title="$(
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER" \
              --jq '.title | @base64' |
              node --input-type=module --eval '
                import { readFileSync } from "node:fs";
                process.stdout.write(
                  Buffer.from(readFileSync(0, "utf8"), "base64"),
                );
              ' &&
              printf '%s' "$title_sentinel"
          )"
          current_title="${current_title%"$title_sentinel"}"
          conventional_title='^([a-z][a-z0-9-]*)(\([a-z0-9][a-z0-9._/-]*\))?(!)?:[ ]([^[:space:]].*[^[:space:]]|[^[:space:]])$'
          if [[ "$current_title" == *$'\n'* ||
                "$current_title" == *$'\r'* ||
                ! "$current_title" =~ $conventional_title ]]; then
            echo "Pull request title must follow <type>[optional scope][!]: <description>." >&2
            exit 1
          fi
          type="${BASH_REMATCH[1]}"
          breaking_marker="${BASH_REMATCH[3]:-}"
          label="$(release_note_label "$type" "$breaking_marker")"
          current_labels="$(
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
              --jq '.[].name'
          )"

          preserve_skip_label=false
          while IFS= read -r current_label; do
            if [[ "$current_label" == "skip-release-notes" ]]; then
              skip_label_actors="$(
                gh api \
                  "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/timeline?per_page=100" \
                  --paginate \
                  --jq '.[] | select(.event == "labeled" and .label.name == "skip-release-notes") | if (.actor.login // "") == "" then "__unattributed__" else .actor.login end'
              )"
              skip_label_actor=""
              while IFS= read -r event_actor; do
                skip_label_actor="$event_actor"
              done <<< "$skip_label_actors"

              if [[ "$skip_label_actor" != "github-actions[bot]" ]]; then
                echo "Preserving existing skip-release-notes label."
                preserve_skip_label=true
              fi
              break
            fi
          done <<< "$current_labels"

          label_already_present=false
          while IFS= read -r current_label; do
            case "$current_label" in
              breaking-change | enhancement | bug | documentation | skip-release-notes)
                if [[ "$current_label" == "skip-release-notes" &&
                      "$preserve_skip_label" == true ]]; then
                  if [[ "$current_label" == "$label" ]]; then
                    label_already_present=true
                  fi
                elif [[ "$current_label" != "$label" ]]; then
                  gh api --method DELETE \
                    "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$current_label" \
                    --silent
                else
                  label_already_present=true
                fi
                ;;
            esac
          done <<< "$current_labels"

          if [[ -z "$label" ]]; then
            echo "No automatic release-note category applies."
            exit 0
          fi

          if [[ "$label_already_present" == true ]]; then
            echo "The current release-note category is already applied."
            exit 0
          fi

          ensure_repository_label() {
            local name="$1" color="$2" description="$3"
            if ! gh api \
              "repos/$GITHUB_REPOSITORY/labels/$name" \
              --silent >/dev/null 2>&1; then
              if ! gh api --method POST "repos/$GITHUB_REPOSITORY/labels" \
                -f "name=$name" \
                -f "color=$color" \
                -f "description=$description" \
                --silent >/dev/null 2>&1; then
                gh api \
                  "repos/$GITHUB_REPOSITORY/labels/$name" \
                  --silent >/dev/null
              fi
            fi
          }

          case "$label" in
            breaking-change)
              ensure_repository_label \
                breaking-change b60205 \
                "Breaking change called out in generated release notes"
              ;;
            skip-release-notes)
              ensure_repository_label \
                skip-release-notes ededed \
                "Omit internal changes from generated release notes"
              ;;
          esac

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
            -f "labels[]=$label" \
            --silent
