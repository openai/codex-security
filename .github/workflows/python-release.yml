name: python-release

on:
  push:
    tags:
      - "python-v*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'openai/codex-security'
    name: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#python-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then
            echo "Python release tags must identify a beta release, such as python-v0.1.0b1." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Python release tags must point to a commit on main." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    if: github.repository == 'openai/codex-security'
    name: build
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"

      - name: Stage and build package
        env:
          SDK_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install build twine
          python sdk/python/scripts/stage_release.py \
            "${RUNNER_TEMP}/openai-codex-security" \
            --source sdk/python \
            --version "$SDK_VERSION"
          python -m build \
            --wheel \
            --sdist \
            --outdir dist/python \
            "${RUNNER_TEMP}/openai-codex-security"
          python -m twine check --strict dist/python/*

      - name: Verify package contents
        env:
          SDK_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tarfile
          import zipfile

          forbidden = (
              b"internal.api.openai.org",
              b"LicenseRef-Proprietary",
              b'"license": "Proprietary"',
              b"github.com/openai/openai",
              b"[tool.oaipkg]",
              b"[tool.buildkite]",
          )
          version = os.environ["SDK_VERSION"]
          plugin_root = pathlib.Path(
              "sdk/python/src/openai_codex_security/_bundled_plugin"
          )
          expected_plugin_files = {
              path.relative_to(plugin_root).as_posix()
              for path in plugin_root.rglob("*")
              if path.is_file()
          }
          required_plugin_files = {
              ".codex-plugin/plugin.json",
              "scripts/deep_scan_config.py",
              "scripts/deep_scan_workbench.py",
              "scripts/validate_scan_contract.py",
          }
          assert required_plugin_files <= expected_plugin_files
          wheel = next(pathlib.Path("dist/python").glob("*.whl"))
          sdist = next(pathlib.Path("dist/python").glob("*.tar.gz"))
          assert version.replace("-", "_") in wheel.name
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              wheel_prefix = "openai_codex_security/_bundled_plugin/"
              wheel_plugin_files = {
                  name.removeprefix(wheel_prefix)
                  for name in names
                  if name.startswith(wheel_prefix) and not name.endswith("/")
              }
              assert wheel_plugin_files == expected_plugin_files, (
                  f"wheel plugin mismatch: missing={sorted(expected_plugin_files - wheel_plugin_files)} "
                  f"extra={sorted(wheel_plugin_files - expected_plugin_files)}"
              )
              for name in names:
                  data = archive.read(name)
                  assert not any(marker in data for marker in forbidden), name
          with tarfile.open(sdist, "r:gz") as archive:
              members = archive.getmembers()
              sdist_marker = "/src/openai_codex_security/_bundled_plugin/"
              sdist_plugin_files = {
                  member.name.split(sdist_marker, 1)[1]
                  for member in members
                  if member.isfile() and sdist_marker in member.name
              }
              assert sdist_plugin_files == expected_plugin_files, (
                  f"sdist plugin mismatch: missing={sorted(expected_plugin_files - sdist_plugin_files)} "
                  f"extra={sorted(sdist_plugin_files - expected_plugin_files)}"
              )
              for member in members:
                  if member.isfile():
                      handle = archive.extractfile(member)
                      assert handle is not None
                      data = handle.read()
                      assert not any(marker in data for marker in forbidden), member.name
          PY

      - name: Upload package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-package
          path: dist/python/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: dist/python

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/python

  verify:
    name: verify
    needs:
      - publish
      - resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"

      - name: Verify published package
        env:
          SDK_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if python -m pip install --no-cache-dir \
              "openai-codex-security==$SDK_VERSION"; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "The release did not become available on PyPI." >&2
              exit 1
            fi
            sleep 10
          done
          codex-security --version | grep -F "$SDK_VERSION"
          codex-security --help >/dev/null
          python - <<'PY'
          import importlib.resources
          import json
          import openai_codex_security

          manifest = importlib.resources.files(openai_codex_security).joinpath(
              "_bundled_plugin/.codex-plugin/plugin.json"
          )
          metadata = json.loads(manifest.read_text())
          assert metadata["version"]
          assert metadata["homepage"] == "https://developers.openai.com/codex/security"
          assert metadata["repository"] == "https://github.com/openai/plugins"
          assert metadata["license"] == "Apache-2.0"
          for relative in (
              "scripts/deep_scan_config.py",
              "scripts/deep_scan_workbench.py",
              "scripts/validate_scan_contract.py",
          ):
              assert manifest.parents[1].joinpath(relative).is_file(), relative
          PY
