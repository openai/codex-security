name: container-ci

on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/container-ci.yml
      - Dockerfile
      - compose.yaml
      - docker/**
      - sdk/typescript/**
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/container-ci.yml
      - Dockerfile
      - compose.yaml
      - docker/**
      - sdk/typescript/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify customer build excludes secrets and scan data
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            '**/.env' \
            '**/.npmrc' \
            '**/node_modules' \
            '**/repositories.csv' \
            '**/results' \
            '**/security-scans' \
            '**/state'; do
            if ! grep -Fxq -- "$pattern" .dockerignore; then
              echo "Missing customer Docker build exclusion: $pattern" >&2
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build customer container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: codex-security:ci

      - name: Verify bundled scanner
        run: |
          docker run --rm codex-security:ci --version
          docker run --rm codex-security:ci bulk-scan --help
          docker run --rm codex-security:ci info --json

      - name: Validate hardened customer Compose configuration
        env:
          CODEX_SECURITY_IMAGE: codex-security:ci
        run: |
          mkdir -p results state
          chmod 700 results state
          printf 'id,repository,revision\n' > repositories.csv
          export CODEX_SECURITY_USER="$(id -u):$(id -g)"
          docker compose config --quiet
          docker compose run --rm codex-security --version

      - name: Verify hardened Codex command sandbox
        run: |
          docker run --rm \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --security-opt "seccomp=$GITHUB_WORKSPACE/docker/codex-security-seccomp.json" \
            --entrypoint node \
            codex-security:ci \
            /usr/local/lib/node_modules/@openai/codex-security/node_modules/@openai/codex/bin/codex.js \
            sandbox /usr/bin/true

      - name: Reject interactive repository discovery
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm codex-security:ci bulk-scan; then
            echo "The customer container must require a repository CSV." >&2
            exit 1
          fi

      - name: Verify host-scoped noninteractive Git credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/sh \
            --env GH_TOKEN=SYNTHETIC_GITHUB_TOKEN \
            codex-security:ci \
            -c 'actual="$(printf "protocol=https\nhost=github.com\n\n" | /usr/local/bin/codex-security-git-credential get)"; test "$actual" = "$(printf "username=x-access-token\npassword=SYNTHETIC_GITHUB_TOKEN")"; test -z "$(printf "protocol=https\nhost=untrusted.example\n\n" | /usr/local/bin/codex-security-git-credential get)"'
