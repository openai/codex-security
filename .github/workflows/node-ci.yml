name: node-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-title:
    name: validate pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ci-mode: ${{ steps.scope.outputs.ci-mode }}

    steps:
      - name: Checkout pull request for change classification
        if: github.event_name == 'pull_request' && github.event.changes.base == null
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide CI mode
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
        run: |
          set -euo pipefail
          ci_mode=full
          check_markdown=false
          if [[ "$EVENT_NAME" == "pull_request" &&
                "$BASE_CHANGED" != "true" ]]; then
            changed_files="$(mktemp)"
            trap 'rm -f "$changed_files"' EXIT
            git diff --no-renames --name-only -z HEAD^1 HEAD > "$changed_files"

            changed=false
            markdown_only=true
            plugin_changed=false
            while IFS= read -r -d '' path; do
              changed=true
              if [[ "$path" != *.md ]]; then
                markdown_only=false
              fi
              if [[ "$path" == plugins/codex-security/* ||
                    "$path" == sdk/typescript/_bundled_plugin/* ]]; then
                plugin_changed=true
              fi
            done < "$changed_files"
            if [[ "$changed" == "true" && "$markdown_only" == "true" ]]; then
              check_markdown=true
              if [[ "$plugin_changed" == "false" ]]; then
                ci_mode=markdown
              fi
            fi
          fi
          printf 'ci-mode=%s\n' "$ci_mode" >> "$GITHUB_OUTPUT"
          printf 'check-markdown=%s\n' "$check_markdown" >> "$GITHUB_OUTPUT"

      - name: Require a Conventional Commit pull request title
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          conventional_title='^([a-z][a-z0-9-]*)(\([a-z0-9][a-z0-9._/-]*\))?(!)?:[ ]([^[:space:]].*[^[:space:]]|[^[:space:]])$'
          if [[ "$PR_TITLE" == *$'\n'* || "$PR_TITLE" == *$'\r'* ||
                ! "$PR_TITLE" =~ $conventional_title ]]; then
            echo "Pull request title must follow <type>[optional scope][!]: <description>." >&2
            exit 1
          fi

      - name: Check plugin source compatibility
        if: steps.scope.outputs.ci-mode == 'markdown'
        run: |
          python .github/scripts/check_plugin_source_compatibility.py

      - name: Set up pnpm
        if: steps.scope.outputs.check-markdown == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: sdk/typescript/package.json
          cache: true
          cache_dependency_path: sdk/typescript/pnpm-lock.yaml

      - name: Set up Node.js
        if: steps.scope.outputs.check-markdown == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        if: steps.scope.outputs.check-markdown == 'true'
        run: pnpm --dir sdk/typescript install --frozen-lockfile

      - name: Check Markdown formatting
        if: steps.scope.outputs.check-markdown == 'true'
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' path; do
            if [[ -f "$GITHUB_WORKSPACE/$path" &&
                  ! -L "$GITHUB_WORKSPACE/$path" ]]; then
              files+=("$GITHUB_WORKSPACE/$path")
            fi
          done < <(git diff --no-renames --name-only -z HEAD^1 HEAD)
          if ((${#files[@]} > 0)); then
            pnpm --dir sdk/typescript exec prettier --check "${files[@]}"
          fi

  package:
    name: build and check package
    needs: validate-title
    if: needs.validate-title.outputs.ci-mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check plugin source boundary
        run: node sdk/typescript/scripts/check-plugin-source.mjs
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: sdk/typescript/package.json
          cache: true
          cache_dependency_path: |
            sdk/typescript/pnpm-lock.yaml
            plugins/codex-security/mcp-app/pnpm-lock.yaml
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22.13.0"
      - name: Install dependencies
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Audit production dependencies
        continue-on-error: true
        run: pnpm --dir sdk/typescript run audit:prod
      - name: Typecheck
        run: pnpm --dir sdk/typescript run types
      - name: Check formatting
        run: pnpm --dir sdk/typescript run format
      - name: Pack
        working-directory: sdk/typescript
        run: pnpm pack --pack-destination ../../dist
      - name: Inspect archive contents
        working-directory: sdk/typescript
        run: node scripts/check-package.mjs ../../dist/*.tgz ../../plugins/codex-security/plugin-files.json
      - name: Upload package for this commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ github.sha }}
          overwrite: true
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  test:
    name: tests / ${{ matrix.os }} / shard-${{ matrix.shard }}
    needs: [validate-title, package]
    if: needs.validate-title.outputs.ci-mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: sdk/typescript/package.json
          cache: true
          cache_dependency_path: |
            sdk/typescript/pnpm-lock.yaml
            plugins/codex-security/mcp-app/pnpm-lock.yaml
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22.13.0"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Download package for this commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.sha }}
          path: dist
      - name: Restore bundled plugin
        run: tar -xzf dist/*.tgz --strip-components=1 -C sdk/typescript package/_bundled_plugin
      - name: Install ripgrep
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Test
        timeout-minutes: 10
        working-directory: sdk/typescript
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "false"
        run: node scripts/run-ci-tests.mjs ${{ matrix.shard }}/3 ${{ matrix.os == 'ubuntu-latest' && '--coverage --coverage-reporter=text --coverage-reporter=lcov' || '' }}
      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-${{ runner.os }}-${{ matrix.shard }}
          overwrite: true
          path: |
            sdk/typescript/reports/junit-*.xml
            sdk/typescript/coverage/lcov.info
            plugins/codex-security/mcp-app/reports/junit.xml
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: installed package / ${{ matrix.os }} / node-${{ matrix.node }}
    needs: [validate-title, package]
    if: needs.validate-title.outputs.ci-mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22.13.0", "24.0.0", "24", "26.0.0", "26"]
        include:
          - os: macos-latest
            node: "22.13.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - name: Download package for this commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.sha }}
          path: dist
      - name: Inspect installed package
        working-directory: sdk/typescript
        run: node scripts/check-package.mjs ../../dist/*.tgz

  mcp:
    name: MCP app tests
    needs: [validate-title, package]
    if: needs.validate-title.outputs.ci-mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: plugins/codex-security/mcp-app/package.json
          cache: true
          cache_dependency_path: plugins/codex-security/mcp-app/pnpm-lock.yaml
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22.13.0"
      - name: Install dependencies
        run: pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Download package for this commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.sha }}
          path: dist
      - name: Restore bundled plugin
        run: tar -xzf dist/*.tgz --strip-components=1 -C sdk/typescript package/_bundled_plugin
      - name: Test MCP app
        run: pnpm --dir plugins/codex-security/mcp-app run test:mcp
      - name: Upload MCP test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-test-reports
          overwrite: true
          path: plugins/codex-security/mcp-app/reports/junit.xml
          if-no-files-found: warn
          retention-days: 14

  plugin-source:
    name: plugin source contracts
    needs: validate-title
    if: needs.validate-title.outputs.ci-mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plugins/codex-security/pyproject.toml
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e 'plugins/codex-security[test]'
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Check plugin source compatibility
        run: |
          python -m ruff check --config plugins/codex-security/pyproject.toml .github/scripts/check_plugin_source_compatibility.py .github/scripts/test_check_plugin_source_compatibility.py plugins/codex-security
          python -m ruff format --check --config plugins/codex-security/pyproject.toml .github/scripts/check_plugin_source_compatibility.py .github/scripts/test_check_plugin_source_compatibility.py plugins/codex-security
          python .github/scripts/check_plugin_source_compatibility.py
      - name: Test Python source contracts
        run: python -m pytest .github/scripts/test_check_plugin_source_compatibility.py plugins/codex-security/tests -q -n 4 --dist worksteal --max-worker-restart 0 --durations=30 --junitxml=reports/python.xml
      - name: Upload Python test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-test-reports
          overwrite: true
          path: reports/python.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22.13.0"
      - name: Test deterministic triage eval contracts
        working-directory: plugins/codex-security/skills/triage-finding/evals
        run: node --run test:deterministic

  required-test:
    name: ${{ matrix.os }} / node-22
    needs: [validate-title, package, test, compatibility, mcp, plugin-source]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Require every Unix coverage job
        if: needs.validate-title.result != 'success' || (needs.validate-title.outputs.ci-mode == 'full' && (needs.package.result != 'success' || needs.test.result != 'success' || needs.compatibility.result != 'success' || needs.mcp.result != 'success' || needs.plugin-source.result != 'success')) || (needs.validate-title.outputs.ci-mode != 'full' && needs.validate-title.outputs.ci-mode != 'markdown')
        run: exit 1

  windows-test:
    name: windows-latest / node-22 / tests-${{ matrix.shard }}
    needs: [validate-title, package]
    if: needs.validate-title.outputs.ci-mode == 'full'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22.13.0"
      - name: Set up pnpm
        run: npm install --global pnpm@11.9.0 --no-audit --no-fund
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Download package for this commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.sha }}
          path: dist
      - name: Restore bundled plugin
        shell: bash
        run: tar -xzf dist/*.tgz --strip-components=1 -C sdk/typescript package/_bundled_plugin
      - name: Prepare private Windows test root
        id: windows-temp
        shell: pwsh
        run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1
      - name: Test shard ${{ matrix.shard }}
        timeout-minutes: 10
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "false"
        run: node sdk/typescript/scripts/run-ci-tests.mjs ${{ matrix.shard }}/7
      - name: Upload Windows test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-Windows-${{ matrix.shard }}
          overwrite: true
          path: sdk/typescript/reports/junit-*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Test machine-wide PowerShell policy
        if: matrix.shard == 3 && runner.environment == 'github-hosted'
        timeout-minutes: 5
        working-directory: sdk/typescript
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "true"
        run: bun test --timeout 120000 ./tests-ts/windows-machine-policy.test.ts

  windows-verify:
    name: windows-latest / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }} / verify
    needs: [validate-title, package]
    if: needs.validate-title.outputs.ci-mode == 'full'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - name: Download package for this commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.sha }}
          path: dist
      - name: Inspect installed package
        working-directory: sdk/typescript
        shell: bash
        run: node scripts/check-package.mjs ../../dist/*.tgz

  windows:
    name: windows-latest / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }}
    runs-on: ubuntu-latest
    if: always()
    needs: [validate-title, windows-test, windows-verify]
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - name: Require every Windows coverage job
        if: needs.validate-title.result != 'success' || (needs.validate-title.outputs.ci-mode == 'full' && (needs.windows-test.result != 'success' || needs.windows-verify.result != 'success')) || (needs.validate-title.outputs.ci-mode != 'full' && needs.validate-title.outputs.ci-mode != 'markdown')
        run: exit 1
