name: node-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-title:
    name: validate pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      container-validate: ${{ steps.scope.outputs.container-validate }}
      test-quality: ${{ steps.scope.outputs.test-quality }}
      workflow-quality: ${{ steps.scope.outputs.workflow-quality }}

    steps:
      - name: Checkout pull request for change classification
        if: github.event_name == 'pull_request' && github.event.changes.base == null
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select additional checks
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
        run: |
          set -euo pipefail
          container_validate=false
          if [[ "$EVENT_NAME" == "push" ]]; then
            container_validate=true
          fi
          test_quality=false
          workflow_quality=false
          if [[ "$EVENT_NAME" == "push" || "$BASE_CHANGED" == "true" ]]; then
            workflow_quality=true
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_CHANGED" == "true" ]]; then
            container_validate=true
            test_quality=true
          fi
          if [[ "$EVENT_NAME" == "pull_request" &&
                "$BASE_CHANGED" != "true" ]]; then
            changed_files="$(mktemp)"
            trap 'rm -f "$changed_files"' EXIT
            git diff --no-renames --name-only -z HEAD^1 HEAD > "$changed_files"

            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/* | .github/actions/* | .github/actionlint.yaml | .github/zizmor.yml | \
                  docker/verify-container-compose.sh)
                  workflow_quality=true
                  ;;
              esac
              case "$path" in
                .dockerignore | .github/workflows/native-*.yml | \
                  .github/actions/download-native/* | Dockerfile | \
                  Dockerfile.dockerignore | compose.yaml | compose.apparmor.yaml | \
                  compose.findings.yaml | compose.runner.yaml | docker/* | \
                  plugins/codex-security/* | sdk/typescript/* | \
                  .github/workflows/container-ci.yml | .github/workflows/container-release.yml | \
                  .github/workflows/container-validate.yml)
                  container_validate=true
                  ;;
                .github/workflows/node-ci.yml | .github/actions/setup-tools/*)
                  container_validate=true
                  test_quality=true
                  ;;
                .github/workflows/test-quality.yml)
                  test_quality=true
                  ;;
              esac
            done < "$changed_files"
          fi
          printf 'container-validate=%s\n' "$container_validate" >> "$GITHUB_OUTPUT"
          printf 'test-quality=%s\n' "$test_quality" >> "$GITHUB_OUTPUT"
          printf 'workflow-quality=%s\n' "$workflow_quality" >> "$GITHUB_OUTPUT"

      - name: Require a Conventional Commit pull request title
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          conventional_title='^([a-z][a-z0-9-]*)(\([a-z0-9][a-z0-9._/-]*\))?(!)?:[ ]([^[:space:]].*[^[:space:]]|[^[:space:]])$'
          if [[ "$PR_TITLE" == *$'\n'* || "$PR_TITLE" == *$'\r'* ||
                ! "$PR_TITLE" =~ $conventional_title ]]; then
            echo "Pull request title must follow <type>[optional scope][!]: <description>." >&2
            exit 1
          fi

  workflow-quality:
    needs: validate-title
    if: needs.validate-title.outputs.workflow-quality == 'true'
    uses: ./.github/workflows/workflow-quality.yml

  static-checks:
    name: typecheck and formatting
    needs: validate-title
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up TypeScript tools
        uses: ./.github/actions/setup-tools
        with:
          cache-dependency-path: |
            sdk/typescript/pnpm-lock.yaml
            plugins/codex-security/mcp-app/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir sdk/typescript run types
      - name: Check formatting
        run: pnpm --dir sdk/typescript run format
      - name: Check MCP formatting
        run: pnpm --dir plugins/codex-security/mcp-app exec prettier --check "**/*.{cjs,cts,js,jsx,mjs,mts,ts,tsx}"

  native:
    needs: validate-title
    uses: ./.github/workflows/native-artifacts.yml

  container-validate:
    needs: [validate-title, native]
    if: needs.validate-title.outputs.container-validate == 'true'
    uses: ./.github/workflows/container-validate.yml

  test-quality:
    needs: [validate-title, native]
    if: needs.validate-title.outputs.test-quality == 'true'
    uses: ./.github/workflows/test-quality.yml
    with:
      native-artifacts-ready: true

  package:
    name: build and check package
    needs: [validate-title, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check plugin source boundary
        run: node sdk/typescript/scripts/check-plugin-source.mjs
      - name: Prepare native runtime
        uses: ./.github/actions/download-native
      - name: Set up TypeScript tools
        uses: ./.github/actions/setup-tools
        with:
          cache-dependency-path: |
            sdk/typescript/pnpm-lock.yaml
            plugins/codex-security/mcp-app/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm --dir sdk/typescript run audit:prod
      - name: Pack
        working-directory: sdk/typescript
        run: pnpm pack --pack-destination ../../dist
      - name: Inspect archive contents
        working-directory: sdk/typescript
        run: node scripts/check-package.mjs ../../dist/*.tgz ../../plugins/codex-security/plugin-files.json
      - name: Upload package for this commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ github.sha }}
          overwrite: true
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  test:
    name: tests / ${{ matrix.os }} / shard-${{ matrix.shard }}
    needs: [validate-title, package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare native runtime
        uses: ./.github/actions/download-native
      - name: Set up TypeScript tools
        uses: ./.github/actions/setup-tools
        with:
          cache-dependency-path: |
            sdk/typescript/pnpm-lock.yaml
            plugins/codex-security/mcp-app/pnpm-lock.yaml
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Download package for this commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.sha }}
          path: dist
      - name: Restore bundled plugin
        run: tar -xzf dist/*.tgz --strip-components=1 -C sdk/typescript package/_bundled_plugin
      - name: Install ripgrep
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Test
        working-directory: sdk/typescript
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "false"
        run: node --experimental-strip-types scripts/run-ci-tests.mts ${{ matrix.shard }}/3 ${{ matrix.os == 'ubuntu-latest' && '--coverage --coverage-reporter=text --coverage-reporter=lcov' || '' }}
      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-${{ runner.os }}-${{ matrix.shard }}
          overwrite: true
          path: |
            sdk/typescript/reports/junit-*.xml
            sdk/typescript/coverage/lcov.info
            plugins/codex-security/mcp-app/reports/junit.xml
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: installed package / ${{ matrix.os }} / node-${{ matrix.node }}
    needs: [validate-title, package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22.13.0", "24.0.0", "24", "26.0.0", "26"]
        include:
          - os: macos-latest
            node: "22.13.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - name: Download package for this commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.sha }}
          path: dist
      - name: Inspect installed package
        working-directory: sdk/typescript
        run: node scripts/check-package.mjs ../../dist/*.tgz

  mcp:
    name: MCP app tests
    needs: [validate-title, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up TypeScript tools
        uses: ./.github/actions/setup-tools
        with:
          cache-dependency-path: plugins/codex-security/mcp-app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Download package for this commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.sha }}
          path: dist
      - name: Restore bundled plugin
        run: tar -xzf dist/*.tgz --strip-components=1 -C sdk/typescript package/_bundled_plugin
      - name: Test MCP app
        run: pnpm --dir plugins/codex-security/mcp-app run test:mcp
      - name: Upload MCP test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-test-reports
          overwrite: true
          path: plugins/codex-security/mcp-app/reports/junit.xml
          if-no-files-found: warn
          retention-days: 14

  plugin-host:
    name: standalone plugin / ${{ matrix.os }}
    needs: validate-title
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout plugin source without the SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            plugins/codex-security
            .github/actions/setup-tools
      - name: Set up TypeScript tools
        uses: ./.github/actions/setup-tools
        with:
          cache-dependency-path: plugins/codex-security/mcp-app/pnpm-lock.yaml
      - name: Install plugin dependencies
        run: pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Build and test the standalone host runtime
        run: node --experimental-strip-types --test plugins/codex-security/mcp-app/scripts/test_host_build.mts

  plugin-source:
    name: plugin source contracts / ${{ matrix.os }} / python-${{ matrix.python }}
    needs: validate-title
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            tests: plugins/codex-security/tests
          - os: ubuntu-latest
            python: "3.12"
            tests: plugins/codex-security/tests
          - os: ubuntu-latest
            python: "3.14"
            tests: plugins/codex-security/tests
          - os: macos-latest
            python: "3.12"
            tests: plugins/codex-security/tests/test_workbench_scan_usage.py
          - os: windows-latest
            python: "3.12"
            tests: plugins/codex-security/tests/test_windows_scan_local_files.py
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
      - name: Set up pnpm
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: ./.github/actions/setup-tools
        with:
          setup-node: false
          compile: true
          cache-dependency-path: |
            sdk/typescript/pnpm-lock.yaml
            plugins/codex-security/mcp-app/pnpm-lock.yaml
      - name: Install plugin dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: plugins/codex-security/pyproject.toml
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -e 'plugins/codex-security[test]'
      - name: Install ripgrep
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Check plugin source compatibility
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m ruff check --config plugins/codex-security/pyproject.toml plugins/codex-security
          python -m ruff format --check --config plugins/codex-security/pyproject.toml plugins/codex-security
          node .github/scripts/check_plugin_source_compatibility.mjs
      - name: Test source compatibility checker
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: node --test .github/scripts/test_check_plugin_source_compatibility.mjs
      - name: Test Python source contracts
        shell: bash
        env:
          PYTHON_TEST_PATH: ${{ matrix.tests }}
        run: python -m pytest "$PYTHON_TEST_PATH" -q -n 4 --dist worksteal --max-worker-restart 0 --durations=30 --junitxml=reports/python.xml
      - name: Require native platform coverage
        if: runner.os != 'Linux'
        run: python -c "import xml.etree.ElementTree as ET; assert not ET.parse('reports/python.xml').findall('.//testcase/skipped'), 'Native platform tests must run without skips'"
      - name: Upload Python test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-test-reports-${{ matrix.os }}-${{ matrix.python }}
          overwrite: true
          path: reports/python.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Build SDK and type-check eval tooling
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pnpm --dir sdk/typescript run build:evals
      - name: Test deterministic triage eval contracts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        working-directory: evals/triage-finding
        run: node --run test:deterministic
      - name: Test secret discovery eval contracts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: node --experimental-strip-types --test evals/secret-discovery/test_*.mts

  required-test:
    name: ${{ matrix.os }} / node-22
    needs:
      [
        validate-title,
        workflow-quality,
        static-checks,
        package,
        test,
        compatibility,
        mcp,
        plugin-host,
        plugin-source,
        container-validate,
      ]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Require selected workflow checks
        if: needs.validate-title.outputs.workflow-quality == 'true' && needs.workflow-quality.result != 'success'
        run: exit 1
      - name: Require every Unix coverage job
        if: needs.validate-title.result != 'success' || (needs.static-checks.result != 'success' || needs.package.result != 'success' || needs.test.result != 'success' || needs.compatibility.result != 'success' || needs.mcp.result != 'success' || needs.plugin-host.result != 'success' || needs.plugin-source.result != 'success')
        run: exit 1
      - name: Require selected container coverage
        if: needs.validate-title.outputs.container-validate == 'true' && needs.container-validate.result != 'success'
        run: exit 1

  windows-test:
    name: windows-latest / node-22 / tests-${{ matrix.shard }}
    needs: [validate-title, package]
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare native runtime
        uses: ./.github/actions/download-native
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Download package for this commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.sha }}
          path: dist
      - name: Restore bundled plugin
        shell: bash
        run: tar -xzf dist/*.tgz --strip-components=1 -C sdk/typescript package/_bundled_plugin
      - name: Prepare private Windows test root
        id: windows-temp
        shell: pwsh
        run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1
      - name: Test shard ${{ matrix.shard }}
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "false"
        run: node --experimental-strip-types sdk/typescript/scripts/run-ci-tests.mts ${{ matrix.shard }}/7
      - name: Upload Windows test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-Windows-${{ matrix.shard }}
          overwrite: true
          path: sdk/typescript/reports/junit-*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Test machine-wide PowerShell policy
        if: matrix.shard == 3 && runner.environment == 'github-hosted'
        timeout-minutes: 7
        working-directory: sdk/typescript
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "true"
        run: bun test --timeout 360000 ./tests-ts/windows-machine-policy.test.ts

  windows-verify:
    name: windows-latest / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }} / verify
    needs: [validate-title, package]
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - name: Download package for this commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.sha }}
          path: dist
      - name: Inspect installed package
        working-directory: sdk/typescript
        shell: bash
        run: node scripts/check-package.mjs ../../dist/*.tgz

  windows:
    name: windows-latest / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }}
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        validate-title,
        static-checks,
        plugin-host,
        plugin-source,
        windows-test,
        windows-verify,
      ]
    strategy:
