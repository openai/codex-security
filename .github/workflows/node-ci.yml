name: node-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.13.0"]
        include:
          - os: ubuntu-latest
            node: "24.0.0"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26.0.0"
          - os: ubuntu-latest
            node: "26"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: sdk/typescript/package.json
          cache: true
          cache_dependency_path: sdk/typescript/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: pnpm --dir sdk/typescript install --frozen-lockfile

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        continue-on-error: true
        run: pnpm --dir sdk/typescript run audit:prod

      - name: Typecheck
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        run: pnpm --dir sdk/typescript run types

      - name: Test
        timeout-minutes: 10
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "false"
        run: pnpm --dir sdk/typescript run ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0' && 'test:ci' || 'test' }}

      - name: Upload test reports
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-22-test-reports
          overwrite: true
          path: |
            sdk/typescript/reports/junit.xml
            sdk/typescript/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        run: pnpm --dir sdk/typescript run format

      - name: Pack
        working-directory: sdk/typescript
        run: pnpm pack --pack-destination ../../dist

      - name: Inspect package
        working-directory: sdk/typescript
        shell: bash
        run: pnpm run check:package ../../dist/*.tgz

  windows-test:
    name: windows-latest / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }} / tests-${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
        shard: [1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Set up pnpm
        run: npm install --global pnpm@11.9.0 --no-audit --no-fund

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile

      - name: Prepare private Windows test root
        id: windows-temp
        shell: pwsh
        run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1

      - name: Test shard ${{ matrix.shard }}
        timeout-minutes: 10
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "false"
        run: node sdk/typescript/scripts/run-windows-ci-tests.mjs ${{ matrix.shard }}

      - name: Test machine-wide PowerShell policy
        if: matrix.shard == 3 && runner.environment == 'github-hosted'
        timeout-minutes: 5
        working-directory: sdk/typescript
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "true"
        run: bun test --timeout 120000 ./tests-ts/windows-machine-policy.test.ts

  windows-verify:
    name: windows-latest / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }} / verify
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Set up pnpm
        run: npm install --global pnpm@11.9.0 --no-audit --no-fund

      - name: Install dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile

      - name: Pack
        working-directory: sdk/typescript
        run: pnpm pack --pack-destination ../../dist

      - name: Inspect package
        working-directory: sdk/typescript
        shell: bash
        run: pnpm run check:package ../../dist/*.tgz

  windows:
    name: windows-latest / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }}
    runs-on: ubuntu-latest
    if: always()
    needs: [windows-test, windows-verify]
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]

    steps:
      - name: Require every Windows coverage job
        if: needs.windows-test.result != 'success' || needs.windows-verify.result != 'success'
        run: exit 1
