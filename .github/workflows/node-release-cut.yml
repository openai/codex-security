name: node-release-cut

on:
  workflow_run:
    workflows: ["node-ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-release-cut
  queue: max

jobs:
  cut:
    if: >-
      github.repository == 'openai/codex-security' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'))
    name: cut release tag
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Resolve the stable package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="${RELEASE_SHA:-$GITHUB_SHA}"

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release tags can only be cut from main." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags can only be cut from commits on main." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release tags can only be cut from commits on main." >&2
            exit 1
          fi

          version="$(node sdk/typescript/scripts/release-automation.mjs version sdk/typescript/package.json)"
          if ! release_summary="$(
            git show "$RELEASE_SHA:.github/release-notes.md" 2>/dev/null
          )"; then
            echo "The tagged commit must include .github/release-notes.md." >&2
            exit 1
          fi
          summary_header="${release_summary%%$'\n'*}"
          summary_body="${release_summary#*$'\n'}"
          expected_header="<!-- release-version: $version -->"
          if [[ "$summary_header" != "$expected_header" ||
                "$summary_body" == "$release_summary" ||
                -z "${summary_body//[[:space:]]/}" ]]; then
            echo "Release notes must start with $expected_header and include a reviewed summary." >&2
            exit 1
          fi

          if ! published_versions="$(
            npm view @openai/codex-security versions \
              --json \
              --registry=https://registry.npmjs.org/
          )"; then
            published_versions="$(
              printf '%s\n' "$published_versions" |
                node sdk/typescript/scripts/release-automation.mjs \
                  initial-published-versions "$version"
            )"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]] &&
             previous_sha="$(git rev-parse "$RELEASE_SHA^" 2>/dev/null)"; then
            if previous_manifest="$(git show "$previous_sha:sdk/typescript/package.json" 2>/dev/null)"; then
              previous_version="$(
                printf '%s\n' "$previous_manifest" |
                  node --input-type=module --eval '
                    import { readFileSync } from "node:fs";
                    const manifest = JSON.parse(readFileSync(0, "utf8"));
                    if (typeof manifest.version !== "string") {
                      throw new Error("The previous package version is missing.");
                    }
                    process.stdout.write(manifest.version);
                  '
              )"
              if [[ "$version" == "$previous_version" ]]; then
                release_mode="$(
                  printf '%s\n' "$published_versions" |
                    node sdk/typescript/scripts/release-automation.mjs \
                      release-mode "$version"
                )"
                if [[ "$release_mode" == "recover" ]]; then
                  echo "Package version is unchanged and already published."
                  echo "changed=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              else
                node sdk/typescript/scripts/release-automation.mjs \
                  require-increase "$version" "$previous_version" >/dev/null
              fi
            fi
          fi

          printf '%s\n' "$published_versions" |
            node sdk/typescript/scripts/release-automation.mjs \
              require-published-increase "$version" >/dev/null

          {
            printf 'changed=true\n'
            printf 'version=%s\n' "$version"
            printf 'tag=npm-v%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Create the exact merged release tag
        if: steps.release.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_SHA="${RELEASE_SHA:-$GITHUB_SHA}"

          query_status=0
          tag_response="$(
            gh api --include \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null
          )" || query_status=$?

          IFS=' ' read -r _ response_status _ <<< "$tag_response" || true
          response_body="$(
            awk 'body { print } /^\r?$/ { body = 1 }' <<< "$tag_response"
          )"

          if [[ "$query_status" == 0 && "$response_status" =~ ^2[0-9]{2}$ ]]; then
            if ! existing_ref="$(
              jq -er '[.object.type, .object.sha] | @tsv' <<< "$response_body"
            )"; then
              echo "Unable to query release tag $RELEASE_TAG." >&2
              exit 1
            fi
          elif [[ "$query_status" != 0 && "$response_status" == 404 &&
                  "$(
                    jq -r '.status // empty' <<< "$response_body" \
                      2>/dev/null || true
                  )" == 404 ]]; then
            existing_ref=""
          else
            echo "Unable to query release tag $RELEASE_TAG." >&2
            exit 1
          fi

          if [[ -n "$existing_ref" ]]; then
            IFS=$'\t' read -r tag_type tag_object <<< "$existing_ref"
            if [[ ! "$tag_object" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Release tag $RELEASE_TAG does not identify a valid commit." >&2
              exit 1
            fi

            case "$tag_type" in
              commit)
                existing_sha="$tag_object"
                ;;
              tag)
                if ! existing_sha="$(
                  gh api \
                    "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
                    --jq 'if .object.type == "commit" then .object.sha else empty end'
                )"; then
                  echo "Release tag $RELEASE_TAG does not identify a valid commit." >&2
                  exit 1
                fi
                ;;
              *)
                echo "Release tag $RELEASE_TAG does not identify a valid commit." >&2
                exit 1
                ;;
            esac

            if [[ ! "$existing_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Release tag $RELEASE_TAG does not identify a valid commit." >&2
              exit 1
            fi
            if [[ "$existing_sha" != "$RELEASE_SHA" ]]; then
              echo "Release tag $RELEASE_TAG already points to a different commit." >&2
              exit 1
            fi
            echo "Release tag $RELEASE_TAG already points to $RELEASE_SHA."
            exit 0
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$RELEASE_SHA" \
            --silent

      - name: Dispatch the protected npm release
        if: steps.release.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run node-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG"
