name: published-install-smoke

on:
  pull_request:
    paths:
      - .github/workflows/published-install-smoke.yml
      - sdk/typescript/scripts/smoke-published-package.mjs
      - sdk/typescript/scripts/package-smoke-npm.mjs
      - sdk/typescript/scripts/package-smoke-timeouts.mjs
      - sdk/typescript/tests-ts/published-install-smoke.test.ts
  schedule:
    - cron: "43 9 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version to verify, or latest
        type: string
        default: latest
      ref:
        description: Source commit or tag containing the smoke checks
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        description: Published npm version to verify, or latest
        type: string
        default: latest
      ref:
        description: Source commit or tag containing the smoke checks
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: published-install-smoke-${{ inputs.version || 'latest' }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: published ${{ inputs.version || 'latest' }} / ${{ matrix.os }} / node-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22", "24", "26"]
        include:
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
    steps:
      - name: Checkout smoke checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install and start the published package
        shell: bash
        env:
          PUBLISHED_VERSION: ${{ inputs.version || 'latest' }}
        run: node sdk/typescript/scripts/smoke-published-package.mjs "$PUBLISHED_VERSION"
