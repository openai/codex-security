name: container-release

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/container-release*.yml
      - Dockerfile
      - Dockerfile.dockerignore
      - compose.yaml
      - compose.apparmor.yaml
      - compose.findings.yaml
      - docker/**
      - sdk/typescript/**
  push:
    tags:
      - "container-v*"
  workflow_dispatch:

concurrency:
  group: container-release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'openai/codex-security'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: scanner
            package: codex-security
          - target: findings-service
            package: codex-security-findings
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/container-release-image.yml
    with:
      target: ${{ matrix.target }}
      package: ${{ matrix.package }}
