server {
    listen 8080;
    location = /api/scaffolder/v2/tasks {
        limit_except POST { deny all; }
        auth_basic "Developer portal";
        auth_basic_user_file /run/secrets/portal_users;
        proxy_set_header Authorization "";
        proxy_pass http://backstage:7007/api/scaffolder/v2/tasks;
    }
    location / { return 404; }
}
