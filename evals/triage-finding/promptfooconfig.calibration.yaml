# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Codex Security triage-finding OSS calibration eval"

prompts:
  - file://./prompts/triage-request.txt

providers:
  - id: openai:codex-sdk:gpt-5.5
    label: "Codex SDK triage-finding calibration"
    config:
      working_dir: "{{triage_runtime_root}}"
      skip_git_repo_check: true
      approval_policy: never
      additional_directories:
        - "{{target_repo}}"
        - "{{triage_node_root}}"
      cli_config:
        default_permissions: triage_runtime_only
        permissions:
          triage_runtime_only:
            filesystem:
              ":minimal": read
              ":workspace_roots": read
            network:
              enabled: false
        features:
          memories: false
          plugins: false
      cli_env:
        CODEX_MCP_NODE_PATH: "{{triage_node_path}}"
        HTTP_PROXY: "{{env.HTTP_PROXY}}"
        HTTPS_PROXY: "{{env.HTTPS_PROXY}}"
        ALL_PROXY: "{{env.ALL_PROXY}}"
        NO_PROXY: "{{env.NO_PROXY}}"

evaluateOptions:
  maxConcurrency: 1

defaultTest:
  options:
    transformVars: file://./scripts/runtime-vars.mts
  vars:
    invocation_preamble: "Use $codex-security:triage-finding to triage the supplied existing security finding."
  assert:
    - type: contains-json
      value: file://./schemas/triage-result-v0.schema.json
    - type: javascript
      value: file://./assertions/triage-io.mts
    - type: javascript
      value: file://./assertions/calibration-evidence.mts

tests: file://./tests/calibration-oss.yaml
