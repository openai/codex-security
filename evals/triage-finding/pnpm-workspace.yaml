packages:
  - .
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - openai
  - "@openai/*"
trustLockfile: true

overrides:
  "glob@13": 14.0.3
  "minimatch@10": 11.0.2
  "@azure/identity@>=4.13.2 <=4.13.3>@azure/msal-node": 7.1.0
  "promptfoo@0.124.1>@hono/node-server": 2.1.5
  "@openai/codex": "$@openai/codex-sdk"
  "@openai/codex-sdk": "$@openai/codex-sdk"
  "ibm-cloud-sdk-core@5.6.0>axios": 1.20.0
  "get-uri@8.0.1>basic-ftp": 6.2.1

allowBuilds:
  "@playwright/browser-chromium": false
  "@swc/core": false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false

# Triage uses the Codex provider, JSON and YAML fixtures, and JavaScript assertions.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk"
  - "@aws-sdk/*"
  - "@aws/bedrock-token-generator"
  - "@azure/*"
  - "@opencode-ai/sdk"
  - natural
  - node-sql-parser
  - pdf-parse
  - read-excel-file
  - sharp
