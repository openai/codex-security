packages:
  - .
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - openai
  - "@openai/*"
trustLockfile: true

overrides:
  "@huggingface/transformers@4.2.0>sharp": 0.35.4
  "@openai/codex": "$@openai/codex-sdk"
  "@openai/codex-sdk": "$@openai/codex-sdk"
  "@openai/codex-security@0.1.27>fast-uri": 3.1.8
  "@opencode-ai/sdk": "$@opencode-ai/sdk"
  "ibm-cloud-sdk-core@5.6.0>axios": 1.20.0
  "get-uri@8.0.1>basic-ftp": 6.2.1
  "onnxruntime-node@1.24.3>adm-zip": 0.6.1
  "socks@2.8.10>ip-address": 10.7.2

allowBuilds:
  "@playwright/browser-chromium": false
  "@swc/core": false
  better-sqlite3: true
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
