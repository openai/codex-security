packages:
  - .
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - openai
  - "@openai/*"
trustLockfile: true

overrides:
  # Keep Promptfoo's interactive dependencies compatible with Node 22.22.0.
  "@inquirer/ansi": 2.0.10
  "@inquirer/core": 12.0.6
  "@inquirer/editor": 5.3.6
  "@inquirer/external-editor": 3.0.7
  "@inquirer/figures": 2.0.10
  "@inquirer/select": 5.2.8
  "glob@13": 14.0.3
  "minimatch@10": 11.0.2
  "promptfoo@0.125.1>@hono/node-server": 2.1.8
  "get-uri@8.0.1>basic-ftp": 6.2.6

allowBuilds:
  "@playwright/browser-chromium": false
  "@swc/core": false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false

# Triage uses the Codex provider, JSON and YAML fixtures, and JavaScript assertions.
ignoredOptionalDependencies:
  - "@aws-sdk/*"
  - "@aws/bedrock-token-generator"
  - "@azure/*"
  - "@opencode-ai/sdk"
  - natural
  - node-sql-parser
  - pdf-parse
  - read-excel-file
  - sharp
