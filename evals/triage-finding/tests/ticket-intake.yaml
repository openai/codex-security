- description: "Unavailable Linear connector stops with setup guidance"
  metadata:
    case_id: ticket-connector-unavailable
    source_type: scanner_ticket
  vars:
    case_id: ticket-connector-unavailable
    target_repo: evals/triage-finding/fixtures/repo
    source_type_under_test: scanner_ticket
    finding_input: "Linear issue SEC-293. Connector observation: the Linear connector is unavailable because it is not connected."
    invocation_preamble: "Use $codex-security:triage-finding to import Linear issue SEC-293."
    expected_ticket_failure: unavailable
    eval_instructions: &failedReadInstructions |-
      This is an automated eval. Treat the connector observation as the result
      of the requested read. Respond exactly as the skill requires after this
      intake failure. Do not inspect code or fabricate the issue contents.
  options: &intakeOnly
    disableDefaultAsserts: true
  assert: &ticketIntake
    - type: javascript
      value: file://./assertions/ticket-intake.mts

