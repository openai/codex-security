- description: "GitHub code scanning uses REST alerts and instances"
  metadata:
    case_id: github-code-scanning
    source_type: github_code_scanning
  vars:
    case_id: github-code-scanning
    target_repo: https://github.com/promptfoo/promptfoo
    source_type_under_test: github_code_scanning
    finding_input: "Source requested: code scanning. In this fixture, the repository metadata identifies refs/heads/trunk as the default branch."
    expected_default_ref: refs/heads/trunk
    invocation_preamble: "Use $codex-security:triage-finding for code scanning alerts in GitHub repo promptfoo/promptfoo."
    expected_github_rest_behavior: code_scanning
    eval_instructions: |-
      This is an automated eval. Return only a JSON object describing the REST
      intake, with keys alerts, instances, and source_type. Each request has a
      path and a parameters object with the required query parameters. Use the
      literal {alert_number} placeholder in the instances path. Do not query live
      GitHub, inspect code, or emit the triage JSON result.
  options: *intakeOnly
  assert: *githubIntake

