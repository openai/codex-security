[project]
name = "codex-security"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "jsonschema[format-nongpl]==4.26.0",
    "packaging==26.3",
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
    "PyYAML==6.0.3",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
required-version = "==0.16.1"
target-version = "py312"

[tool.ruff.lint]
select = ["I"]

[tool.setuptools.packages.find]
include = []

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"
