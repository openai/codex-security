packages:
  - .
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - openai
  - "@openai/*"
trustLockfile: true

overrides:
  "@openai/codex": "$@openai/codex-sdk"
  "@openai/codex-sdk": "$@openai/codex-sdk"
  "@opencode-ai/sdk": "$@opencode-ai/sdk"

allowBuilds:
  "@playwright/browser-chromium": false
  "@swc/core": false
  better-sqlite3: true
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
