- description: "GitHub repo without source prompts for REST source selection"
  metadata:
    case_id: github-repo-source-choice
    source_type: github_repo
  vars:
    case_id: github-repo-source-choice
    target_repo: https://github.com/promptfoo/promptfoo
    source_type_under_test: github_repo
    finding_input: ""
    invocation_preamble: "Use $codex-security:triage-finding with GitHub repo promptfoo/promptfoo."
    expected_github_rest_behavior: choose_source
    eval_instructions: |-
      This is an automated eval. A GitHub repository was supplied, but no
      GitHub finding source was specified. Follow the GitHub REST intake
      behavior and do not triage findings yet.
  options:
    disableDefaultAsserts: true
  assert:
    - type: javascript
      value: file://./assertions/github-rest-intake.js

- description: "GitHub source infers attached Codex project repository"
  metadata:
    case_id: github-project-repo-inference
    source_type: github_repo
  vars:
    case_id: github-project-repo-inference
    target_repo: "No explicit repository supplied by the user."
    source_type_under_test: github_repo
    finding_input: ""
    invocation_preamble: "Use $codex-security:triage-finding from GitHub in the current Codex project."
    expected_github_rest_behavior: project_repo_inference
    expected_inferred_repo: promptfoo/promptfoo
    eval_instructions: |-
      This is an automated eval. The user did not type an owner/repo or URL, but
      the current Codex project attachment indicates GitHub repository
      promptfoo/promptfoo. Infer that repository, ask only for the GitHub
      finding source, and do not triage findings yet.
  options:
    disableDefaultAsserts: true
  assert:
    - type: javascript
      value: file://./assertions/github-rest-intake.js

