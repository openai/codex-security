[package]
name = "codex-security-native"
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.13.0", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]
napi-build = "=2.5.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
