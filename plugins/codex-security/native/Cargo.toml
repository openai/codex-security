[package]
name = "codex-security-native"
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep N-API pins in sync with the version-specific license fallbacks in notices.mts.
napi = { version = "=3.14.2", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.12"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_Threading", "Win32_System_JobObjects"] }

[build-dependencies]
# Keep this pin in sync with the version-specific license fallback in notices.mts.
napi-build = "=2.6.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
