minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - openai
  - "@openai/*"
trustLockfile: true

# Stryker rewrites tsconfig files through the compiler API removed in TypeScript 7.
packageExtensions:
  "@stryker-mutator/core@10.0.0":
    dependencies:
      typescript: "6.0.3"

allowBuilds:
  esbuild: false
