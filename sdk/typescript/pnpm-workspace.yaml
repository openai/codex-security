minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - openai
  - "@openai/*"
trustLockfile: true

# Preserve the JUnit comparator's character-class matching with minimatch 11.
patchedDependencies:
  "@isaacs/nonrecursive-glob-match@1.0.3": patches/nonrecursive-glob-match-1.0.3.patch

overrides:
  "typed-rest-client@2.3.1>qs": 6.16.1

# Stryker rewrites tsconfig files through the compiler API removed in TypeScript 7.
packageExtensions:
  "@stryker-mutator/core@10.1.1":
    dependencies:
      typescript: "6.0.3"

allowBuilds:
  esbuild: false
